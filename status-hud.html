<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Depot HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #0d0c0c;
    --panel-edge: #262322;
    --text: #f5f1ea;
    --muted: #8a8580;
    --orange: #ff7300;
    --red: #da291c;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    width: 100vw; height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  #stripe{
    position:fixed;
    top:0; left:0; right:0;
    height: 14px;
    display:flex;
  }
  #stripe span{ flex:1; }
  #stripe span:first-child{ background: var(--orange); }
  #stripe span:last-child{ background: var(--red); }

  #badge{
    position:fixed;
    top: clamp(28px, 3vw, 48px);
    left: clamp(28px, 3vw, 48px);
    display:flex;
    align-items:center;
    gap:12px;
  }
  #badge .mark{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(24px, 2.6vh, 36px);
    color: var(--bg);
    background: var(--orange);
    padding: 6px 12px;
    border-radius: 6px;
    letter-spacing: 0.02em;
  }
  #badge .badge-label{
    font-size: clamp(15px, 1.6vh, 20px);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }

  #slide-index{
    position:fixed;
    top: clamp(28px, 3vw, 48px);
    right: clamp(28px, 3vw, 48px);
    font-family:'Archivo Black', sans-serif;
    color: var(--muted);
    font-size: clamp(16px, 1.8vh, 24px);
  }
  #slide-index b{ color: var(--orange); }

  #wrap{
    text-align:center;
  }
  #eyebrow{
    font-weight: 600;
    font-size: clamp(18px, 2vh, 26px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: clamp(6px, 1vw, 14px);
  }
  #big-number{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(180px, 34vh, 560px);
    line-height: 1;
    color: var(--orange);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 60px rgba(255,115,0,0.25);
  }
  #label{
    margin-top: 8px;
    font-weight: 600;
    font-size: clamp(28px, 5vh, 50px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
  }
  #underline{
    width: clamp(100px, 10vw, 180px);
    height: 8px;
    background: var(--red);
    margin: 22px auto 0;
    border-radius: 3px;
  }
  #percent-note{
    margin-top: 18px;
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(30px, 5.5vh, 52px);
    color: var(--orange);
    display:none;
  }
  #percent-note .of-total{
    font-family: 'Archivo', sans-serif;
    font-weight: 500;
    color: var(--muted);
    font-size: 0.55em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-left: 8px;
  }
  #top-list{
    display:none;
    flex-direction: column;
    gap: 18px;
    margin-top: 10px;
    min-width: clamp(500px, 46vw, 900px);
  }
  #top-list .row{
    display:flex;
    align-items:center;
    gap: 20px;
    background: #17130f;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 14px 26px;
    text-align:left;
  }
  #top-list .row.rank-1{
    border-color: var(--orange);
    background: #201509;
  }
  #top-list .rank{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(30px, 5vh, 48px);
    color: var(--muted);
    width: 1.4em;
    flex-shrink: 0;
  }
  #top-list .row.rank-1 .rank{ color: var(--orange); }
  #top-list .cat-name{
    flex:1;
    font-size: clamp(22px, 3.4vh, 34px);
    font-weight: 600;
    color: var(--text);
  }
  #top-list .cat-count{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(32px, 5.4vh, 52px);
    color: var(--orange);
  }
  #top-list .empty-note{
    color: var(--muted);
    font-size: clamp(18px, 2.6vh, 28px);
    padding: 20px 0;
  }
  #quote-block{
    display:none;
    max-width: 62vw;
    font-family: 'Archivo', sans-serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(28px, 5vh, 54px);
    line-height: 1.3;
    color: var(--text);
    text-align:center;
  }
  #quote-block::before, #quote-block::after{
    color: var(--orange);
  }
  #quote-block::before{ content: '“'; }
  #quote-block::after{ content: '”'; }

  #project-list{
    display:none;
    flex-direction: column;
    gap: 14px;
    margin-top: 10px;
    min-width: clamp(420px, 46vw, 780px);
    max-height: 52vh;
    overflow: hidden;
  }
  #project-list .row{
    text-align:left;
    background: #17130f;
    border: 1px solid var(--panel-edge);
    border-left: 4px solid var(--orange);
    border-radius: 10px;
    padding: 12px 22px;
  }
  #project-list .proj-name{
    font-size: clamp(19px, 2.6vh, 28px);
    font-weight: 600;
    color: var(--text);
  }
  #project-list .proj-site{
    margin-top: 3px;
    font-size: clamp(14px, 1.8vh, 19px);
    color: var(--muted);
  }
  #project-footer{
    display:none;
    margin-top: 16px;
    color: var(--muted);
    font-size: clamp(14px, 1.6vh, 19px);
    letter-spacing: 0.04em;
  }
  #meta{
    margin-top: 30px;
    color: var(--muted);
    font-size: clamp(15px, 1.8vh, 22px);
    letter-spacing: 0.04em;
  }
  #breakdown{
    margin-top: 26px;
    display:flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content:center;
    max-width: 70vw;
  }
  #breakdown .chip{
    display:flex;
    align-items:baseline;
    gap: 8px;
    background: #17130f;
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    padding: 8px 18px;
  }
  #breakdown .chip .owner-name{
    font-size: clamp(18px, 2.6vh, 26px);
    font-weight: 500;
    color: var(--text);
  }
  #breakdown .chip .owner-count{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(20px, 3vh, 30px);
    color: var(--orange);
  }
  #warning{
    margin-top: 20px;
    display:none;
    color: #2a1c14;
    background: var(--orange);
    border: none;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
  }

  #clock{
    position:fixed;
    right: clamp(28px, 3vw, 48px);
    bottom: clamp(46px, 6vh, 68px);
    font-family:'Archivo Black', sans-serif;
    color: var(--muted);
    font-size: clamp(18px, 2.2vh, 28px);
    font-variant-numeric: tabular-nums;
  }
  #date{
    position:fixed;
    left: clamp(28px, 3vw, 48px);
    bottom: clamp(46px, 6vh, 68px);
    font-family:'Archivo Black', sans-serif;
    color: var(--muted);
    font-size: clamp(18px, 2.2vh, 28px);
  }

  #progress-track{
    position:fixed;
    left: clamp(28px, 3vw, 48px);
    right: clamp(28px, 3vw, 48px);
    bottom: clamp(24px, 3vw, 40px);
    height: 5px;
    background: var(--panel-edge);
    border-radius: 5px;
    overflow:hidden;
  }
  #progress-fill{
    height:100%;
    width:0%;
    background: var(--orange);
    border-radius: 5px;
  }
</style>
</head>
<body>
  <div id="stripe"><span></span><span></span></div>
  <div id="badge">
    <div class="mark">WB</div>
    <div class="badge-label">Tech Depot</div>
  </div>
  <div id="slide-index"><b id="slide-num">1</b> / <span id="slide-total">1</span></div>

  <div id="wrap">
    <div id="eyebrow">Open Cases</div>
    <div id="big-number">—</div>
    <div id="label">Loading…</div>
    <div id="underline"></div>
    <div id="percent-note"></div>
    <div id="top-list"></div>
    <div id="project-list"></div>
    <div id="project-footer"></div>
    <div id="quote-block"></div>
    <div id="meta">SNAPSHOT — NOT LIVE &nbsp;·&nbsp; Updates Regularly</div>
    <div id="breakdown"></div>
    <div id="warning">Showing sample data — check DATA_URL in config</div>
  </div>

  <div id="date">-- --- --</div>
  <div id="clock">--:--</div>
  <div id="progress-track"><div id="progress-fill"></div></div>

<script>
/* ============================================================
   CONFIG

   One workbook drives every slide below. Point DATA_URL at the
   raw case-list export living in the same repo/folder as this
   page (same-origin — see notes from earlier in the build).

   STATUS_COLUMN must match your export's column header exactly.
   Each slide either counts every row (filterValue: null) or
   counts rows where STATUS_COLUMN equals filterValue.

   To add more slides later (you mentioned more are coming),
   just add another { label, filterValue } entry below.
   ============================================================ */
const DATA_URL = "data.xlsx";
const SHEET_NAME = "";              // leave blank to use the first tab
const STATUS_COLUMN = "Status Reason";
const DWELL_SECONDS = 10;           // how long each slide stays on screen
const SYNC_MINUTE_PAST_HOUR = 2;    // refetch this many minutes after each hour,
                                     // to line up with the hourly export script
const FALLBACK_REFETCH_MINUTES = 5; // safety-net refetch, independent of the above

const OWNER_COLUMN = "Owner";
const HOLD_CODE_COLUMN = "On Hold Code";
const CSI_COLUMN = "CSI Sub Category";
const CUSTOMER_COLUMN = "Customer";

// ── Resolved-cases source (separate Dynamics view/export) ──
const RESOLVED_URL = "resolved.xlsx";
const RESOLVED_SHEET_NAME = "";
const RESOLVED_DATE_COLUMN = "Resolved On";  // verify against your real export

// ── Ongoing-projects source (manually updated) ──
const PROJECTS_URL = "projects.xlsx";
const PROJECTS_SHEET_NAME = "";
const PROJECT_NAME_COLUMN = "Project";
const PROJECT_SITE_COLUMN = "Site/Unit";
const PROJECT_STATUS_COLUMN = "Status";  // expects "Ongoing" or "Completed"

const SLIDES = [
  { label: "Total",       filterValue: null },
  { label: "Unassigned",  filterValue: "Assigned", showPercentOfTotal: true },
  { label: "In Progress", filterValue: "In Progress", breakdownBy: OWNER_COLUMN, exclude: ["Tech Depot"],
    sampleBreakdown: [
      { name: "Sarah Lucio", count: 14 },
      { name: "John Widner", count: 9 },
      { name: "Lawrence Conway", count: 3 }
    ] },
  { label: "On Hold",     filterValue: "On Hold", breakdownBy: HOLD_CODE_COLUMN, exclude: [],
    sampleBreakdown: [
      { name: "Waiting for Customer", count: 26 },
      { name: "Waiting for Hardware", count: 7 },
      { name: "Waiting for Vendor", count: 2 }
    ] },
  { label: "Top Ticket Drivers", type: "topN", column: CSI_COLUMN, topN: 3 },
  { label: "Customers With Multiple Cases", type: "topN", column: CUSTOMER_COLUMN, topN: 5, minCount: 2, showRank: false,
    sampleOverride: [
      { name: "WB Unit 0816", count: 3 },
      { name: "WB Franchise Unit 0369", count: 2 },
      { name: "WB Unit 0840", count: 2 }
    ] },
  { label: "Did You Know", type: "fact" },
  { label: "Cases Resolved", type: "resolvedCycle", source: "resolved" }
  // Ongoing Projects slide removed for now — add back once projects.xlsx is ready:
  // { label: "Ongoing Projects", type: "projects", source: "projects" }
];

const SAMPLE_COUNTS = [47, 12, 24, 8]; // fallback numbers if the fetch fails, matched to SLIDES order
const SAMPLE_BREAKDOWN = [
  { name: "Sarah Lucio", count: 9 },
  { name: "John Widner", count: 8 },
  { name: "Lawrence Conway", count: 7 }
];
const SAMPLE_TOP_DRIVERS = [
  { name: "HHPOS - Payment Device", count: 19 },
  { name: "POS - Payment Device", count: 11 },
  { name: "TPHC Printer", count: 7 }
];
const SAMPLE_RESOLVED_COUNTS = { day: 6, week: 31, month: 118, year: 742 };
const SAMPLE_PROJECTS = [
  { name: "POS Terminal Refresh", site: "Units 0410, 0522, 0816", status: "Ongoing" },
  { name: "Kitchen Display Rollout", site: "DFW Region", status: "Ongoing" },
  { name: "Drive-Thru Timer Upgrade", site: "Unit 1204", status: "Ongoing" }
];
const SAMPLE_PROJECTS_COMPLETED_COUNT = 5;
/* ============================================================ */

let rawRows = null;
let usingSample = false;
let resolvedRows = null;
let usingSampleResolved = false;
let projectRows = null;
let usingSampleProjects = false;
let currentIndex = 0;
let resolvedCycleIndex = 0;

function fmtTime(){
  return new Date().toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function isRowEmpty(row){
  return Object.values(row).every(v => v === '' || v === null || v === undefined);
}

async function fetchWorkbookRows(url, sheetNamePref){
  const cacheBustUrl = url + (url.includes('?') ? '&' : '?') + 'v=' + Date.now();
  const resp = await fetch(cacheBustUrl, { cache: 'no-store' });
  if (!resp.ok) throw new Error('fetch failed: ' + resp.status);
  const buffer = await resp.arrayBuffer();
  const workbook = XLSX.read(buffer, { type: 'array' });
  const sheetName = sheetNamePref && workbook.SheetNames.includes(sheetNamePref)
    ? sheetNamePref
    : workbook.SheetNames[0];
  const sheet = workbook.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' }).filter(r => !isRowEmpty(r));
  if (!rows.length) throw new Error('empty sheet');
  return rows;
}

async function loadWorkbook(){
  try {
    rawRows = await fetchWorkbookRows(DATA_URL, SHEET_NAME);
    usingSample = false;
  } catch (err){
    rawRows = null;
    usingSample = true;
  }
}

async function loadResolvedWorkbook(){
  try {
    resolvedRows = await fetchWorkbookRows(RESOLVED_URL, RESOLVED_SHEET_NAME);
    usingSampleResolved = false;
  } catch (err){
    resolvedRows = null;
    usingSampleResolved = true;
  }
}

async function loadProjectsWorkbook(){
  try {
    projectRows = await fetchWorkbookRows(PROJECTS_URL, PROJECTS_SHEET_NAME);
    usingSampleProjects = false;
  } catch (err){
    projectRows = null;
    usingSampleProjects = true;
  }
}

async function loadAllSources(){
  await Promise.all([
    loadWorkbook(),
    loadResolvedWorkbook(),
    loadProjectsWorkbook()
  ]);
}

function countForSlide(slide, index){
  if (usingSample || !rawRows){
    return SAMPLE_COUNTS[index] ?? 0;
  }
  if (slide.filterValue === null){
    return rawRows.length;
  }
  return rawRows.filter(r => r[STATUS_COLUMN] === slide.filterValue).length;
}

function breakdownForSlide(slide){
  if (!slide.breakdownBy) return null;
  if (usingSample || !rawRows){
    return slide.sampleBreakdown || SAMPLE_BREAKDOWN;
  }
  const exclude = slide.exclude || [];
  const matching = rawRows.filter(r =>
    (slide.filterValue === null || r[STATUS_COLUMN] === slide.filterValue) &&
    !exclude.includes(r[slide.breakdownBy])
  );
  const counts = {};
  matching.forEach(r => {
    const key = r[slide.breakdownBy] || '(unassigned)';
    counts[key] = (counts[key] || 0) + 1;
  });
  return Object.entries(counts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);
}

const QUOTES = [
  "Every ticket closed is one less thing standing between someone and their job.",
  "Slow and steady clears the queue.",
  "The best fix is the one that doesn't come back.",
  "Small updates, fewer surprises.",
  "A calm queue is a well-run queue.",
  "Progress beats perfection — keep the tickets moving.",
  "Good documentation today saves a headache tomorrow."
];

function daysBetween(date1, date2){
  const ms = Math.abs(date2 - date1);
  return Math.floor(ms / (1000 * 60 * 60 * 24));
}

function excelDateToJS(value){
  // Handles both real Date objects and Excel serial numbers
  if (value instanceof Date) return value;
  if (typeof value === 'number') {
    return new Date(Math.round((value - 25569) * 86400 * 1000));
  }
  const parsed = new Date(value);
  return isNaN(parsed) ? null : parsed;
}

function getComputedFacts(){
  const facts = [];
  if (usingSample || !rawRows || !rawRows.length) return facts;

  // Oldest open case
  let oldest = null;
  rawRows.forEach(r => {
    const created = excelDateToJS(r['Created On']);
    if (created && (!oldest || created < oldest.date)){
      oldest = { date: created, caseNumber: r['Case Number'] || '' };
    }
  });
  if (oldest){
    const age = daysBetween(oldest.date, new Date());
    facts.push({
      kind: 'number',
      eyebrow: 'Case Insight',
      value: age,
      label: 'Days Old — Oldest Open Case',
      sub: oldest.caseNumber
    });
  }

  // Busiest agent overall (excluding Tech Depot)
  const ownerCounts = {};
  rawRows.forEach(r => {
    const owner = r[OWNER_COLUMN];
    if (!owner || owner === 'Tech Depot') return;
    ownerCounts[owner] = (ownerCounts[owner] || 0) + 1;
  });
  const busiest = Object.entries(ownerCounts).sort((a, b) => b[1] - a[1])[0];
  if (busiest){
    facts.push({
      kind: 'number',
      eyebrow: 'Case Insight',
      value: busiest[1],
      label: `Open Cases — ${busiest[0]}`,
      sub: 'Most cases currently assigned'
    });
  }

  return facts;
}

function getRandomFact(){
  const computed = getComputedFacts();
  const pool = [
    ...computed,
    ...QUOTES.map(q => ({ kind: 'quote', text: q }))
  ];
  if (!pool.length){
    return { kind: 'quote', text: QUOTES[Math.floor(Math.random() * QUOTES.length)] };
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

const RESOLVED_PERIODS = [
  { key: 'day',   label: 'Today' },
  { key: 'week',  label: 'This Week' },
  { key: 'month', label: 'This Month' },
  { key: 'year',  label: 'This Year' }
];

function startOfPeriod(period, now){
  const d = new Date(now);
  d.setHours(0, 0, 0, 0);
  if (period === 'day') return d;
  if (period === 'week'){
    const dayOfWeek = d.getDay(); // 0 = Sunday
    const diffToMonday = (dayOfWeek === 0) ? 6 : dayOfWeek - 1;
    d.setDate(d.getDate() - diffToMonday);
    return d;
  }
  if (period === 'month'){
    d.setDate(1);
    return d;
  }
  if (period === 'year'){
    d.setMonth(0, 1);
    return d;
  }
  return d;
}

function getResolvedCount(periodKey){
  if (usingSampleResolved || !resolvedRows){
    return SAMPLE_RESOLVED_COUNTS[periodKey] ?? 0;
  }
  const now = new Date();
  const start = startOfPeriod(periodKey, now);
  return resolvedRows.filter(r => {
    const d = excelDateToJS(r[RESOLVED_DATE_COLUMN]);
    return d && d >= start && d <= now;
  }).length;
}

function getOngoingProjects(){
  if (usingSampleProjects || !projectRows){
    return SAMPLE_PROJECTS;
  }
  return projectRows
    .filter(r => (r[PROJECT_STATUS_COLUMN] || '').toString().trim().toLowerCase() === 'ongoing')
    .map(r => ({
      name: r[PROJECT_NAME_COLUMN] || '(untitled)',
      site: r[PROJECT_SITE_COLUMN] || '',
      status: r[PROJECT_STATUS_COLUMN] || ''
    }));
}

function getCompletedProjectsCount(){
  if (usingSampleProjects || !projectRows){
    return SAMPLE_PROJECTS_COMPLETED_COUNT;
  }
  return projectRows.filter(r => (r[PROJECT_STATUS_COLUMN] || '').toString().trim().toLowerCase() === 'completed').length;
}

function topDriversForSlide(slide){
  if (slide.type !== 'topN') return null;
  if (usingSample || !rawRows){
    return (slide.sampleOverride || SAMPLE_TOP_DRIVERS).slice(0, slide.topN || 3);
  }
  const counts = {};
  rawRows.forEach(r => {
    const key = r[slide.column] || '(uncategorized)';
    counts[key] = (counts[key] || 0) + 1;
  });
  let sorted = Object.entries(counts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);

  if (slide.minCount){
    sorted = sorted.filter(item => item.count >= slide.minCount);
  }
  if (!sorted.length) return [];

  const n = slide.topN || 3;
  if (sorted.length <= n) return sorted;

  // include every entry tied with the Nth-place count, not just a hard cutoff
  const cutoffCount = sorted[n - 1].count;
  return sorted.filter((item, i) => i < n || item.count === cutoffCount);
}

function renderSlide(index){
  const slide = SLIDES[index];
  document.getElementById('slide-num').textContent = index + 1;
  document.getElementById('slide-total').textContent = SLIDES.length;

  const warningEl = document.getElementById('warning');
  const sampleFlagBySource = { main: usingSample, resolved: usingSampleResolved, projects: usingSampleProjects };
  const isSlideUsingSample = sampleFlagBySource[slide.source || 'main'];
  warningEl.style.display = isSlideUsingSample ? 'block' : 'none';

  const numEl = document.getElementById('big-number');
  const labelEl = document.getElementById('label');
  const underlineEl = document.getElementById('underline');
  const topListEl = document.getElementById('top-list');
  const percentEl = document.getElementById('percent-note');
  const breakdownEl = document.getElementById('breakdown');
  const quoteEl = document.getElementById('quote-block');
  const eyebrowEl = document.getElementById('eyebrow');
  const projectListEl = document.getElementById('project-list');
  const projectFooterEl = document.getElementById('project-footer');

  // reset shared elements to a known state before each slide's branch fills them in
  numEl.style.display = 'none';
  underlineEl.style.display = 'none';
  percentEl.style.display = 'none';
  breakdownEl.style.display = 'none';
  topListEl.style.display = 'none';
  topListEl.innerHTML = '';
  quoteEl.style.display = 'none';
  quoteEl.textContent = '';
  projectListEl.style.display = 'none';
  projectListEl.innerHTML = '';
  projectFooterEl.style.display = 'none';
  projectFooterEl.textContent = '';
  eyebrowEl.textContent = 'Open Cases';

  if (slide.type === 'topN'){
    labelEl.textContent = slide.label;
    const drivers = topDriversForSlide(slide);
    if (!drivers.length){
      topListEl.innerHTML = `<div class="empty-note">No entries currently match this view.</div>`;
    } else {
      topListEl.innerHTML = drivers.map((item) => {
        const rank = drivers.filter(d => d.count > item.count).length + 1;
        const rankBadge = slide.showRank === false ? '' : `<span class="rank">#${rank}</span>`;
        return `<div class="row rank-${rank}">${rankBadge}<span class="cat-name">${item.name}</span><span class="cat-count">${item.count}</span></div>`;
      }).join('');
    }
    topListEl.style.display = 'flex';
    return;
  }

  if (slide.type === 'fact'){
    const fact = getRandomFact();
    labelEl.textContent = slide.label || 'Did You Know';
    if (fact.kind === 'quote'){
      eyebrowEl.textContent = 'A Little Motivation';
      quoteEl.textContent = fact.text;
      quoteEl.style.display = 'block';
    } else {
      eyebrowEl.textContent = fact.eyebrow || 'Case Insight';
      numEl.textContent = fact.value.toLocaleString();
      numEl.style.display = 'block';
      underlineEl.style.display = 'block';
      labelEl.textContent = fact.label;
      if (fact.sub){
        percentEl.innerHTML = `<span class="of-total" style="margin-left:0; font-size:0.5em;">${fact.sub}</span>`;
        percentEl.style.display = 'block';
      }
    }
    return;
  }

  if (slide.type === 'resolvedCycle'){
    const period = RESOLVED_PERIODS[resolvedCycleIndex % RESOLVED_PERIODS.length];
    eyebrowEl.textContent = 'Cases Resolved';
    const count = getResolvedCount(period.key);
    numEl.textContent = count.toLocaleString();
    numEl.style.display = 'block';
    underlineEl.style.display = 'block';
    labelEl.textContent = period.label;
    resolvedCycleIndex++;
    return;
  }

  if (slide.type === 'projects'){
    eyebrowEl.textContent = 'Tech Depot';
    labelEl.textContent = slide.label || 'Ongoing Projects';
    const ongoing = getOngoingProjects();
    if (!ongoing.length){
      projectListEl.innerHTML = `<div class="row"><span class="proj-name">No ongoing projects listed.</span></div>`;
    } else {
      projectListEl.innerHTML = ongoing.map(p =>
        `<div class="row"><div class="proj-name">${p.name}</div><div class="proj-site">${p.site}</div></div>`
      ).join('');
    }
    projectListEl.style.display = 'flex';
    const completedCount = getCompletedProjectsCount();
    projectFooterEl.textContent = `${completedCount} completed recently`;
    projectFooterEl.style.display = 'block';
    return;
  }

  // standard single-number slides
  numEl.style.display = 'block';
  underlineEl.style.display = 'block';

  const count = countForSlide(slide, index);
  numEl.textContent = count.toLocaleString();
  labelEl.textContent = slide.label;

  const breakdown = breakdownForSlide(slide);
  if (breakdown && breakdown.length){
    breakdownEl.innerHTML = breakdown.map(item =>
      `<div class="chip"><span class="owner-name">${item.name}</span><span class="owner-count">${item.count}</span></div>`
    ).join('');
    breakdownEl.style.display = 'flex';
  } else {
    breakdownEl.innerHTML = '';
    breakdownEl.style.display = 'none';
  }

  if (slide.showPercentOfTotal){
    const totalCount = usingSample || !rawRows ? SAMPLE_COUNTS[0] : rawRows.length;
    const pct = totalCount ? ((count / totalCount) * 100).toFixed(1) : '0.0';
    percentEl.innerHTML = `${pct}%<span class="of-total">of Total Open Cases</span>`;
    percentEl.style.display = 'block';
  } else {
    percentEl.innerHTML = '';
    percentEl.style.display = 'none';
  }
}

function startProgressBar(){
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth;
  fill.style.transition = `width linear ${DWELL_SECONDS}s`;
  fill.style.width = '100%';
}

function nextSlide(){
  currentIndex = (currentIndex + 1) % SLIDES.length;
  renderSlide(currentIndex);
  startProgressBar();
}

function msUntilNextSyncPoint(){
  const now = new Date();
  const next = new Date(now);
  next.setMinutes(SYNC_MINUTE_PAST_HOUR, 0, 0);
  if (next <= now){
    next.setHours(next.getHours() + 1);
  }
  return next - now;
}

function scheduleHourlySync(){
  const delay = msUntilNextSyncPoint();
  setTimeout(async () => {
    await loadAllSources();
    renderSlide(currentIndex);
    // now that we're aligned, repeat every hour on the dot
    setInterval(async () => {
      await loadAllSources();
      renderSlide(currentIndex);
    }, 60 * 60 * 1000);
  }, delay);
}

async function init(){
  await loadAllSources();
  renderSlide(currentIndex);
  startProgressBar();
  setInterval(nextSlide, DWELL_SECONDS * 1000);
  scheduleHourlySync();

  // Fallback: independent of the aligned hourly sync above, also check
  // every FALLBACK_REFETCH_MINUTES regardless. If the aligned trigger ever
  // gets missed (slow git push, tab throttling, a network blip), this
  // guarantees the data is never more than that many minutes stale.
  setInterval(async () => {
    await loadAllSources();
    renderSlide(currentIndex);
  }, FALLBACK_REFETCH_MINUTES * 60 * 1000);
}

async function requestWakeLock(){
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    // Wake Lock not available/permitted in this environment — the
    // "Allow App to Manage Power" kiosk policy needs to be on for
    // this to succeed.
  }
}

// re-request if the lock gets released (e.g. after certain browser events)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

function updateClock(){
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function updateDate(){
  const el = document.getElementById('date');
  if (el) el.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

init();
requestWakeLock();
updateClock();
updateDate();
setInterval(updateClock, 1000);
setInterval(updateDate, 60 * 1000);
</script>
