<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tech Depot HUD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg: #0d0c0c;
    --panel-edge: #262322;
    --text: #f5f1ea;
    --muted: #8a8580;
    --orange: #ff7300;
    --red: #da291c;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', sans-serif;
    width: 100vw; height: 100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
  }

  #stripe{
    position:fixed;
    top:0; left:0; right:0;
    height: 14px;
    display:flex;
  }
  #stripe span{ flex:1; }
  #stripe span:first-child{ background: var(--orange); }
  #stripe span:last-child{ background: var(--red); }

  #badge{
    position:fixed;
    top: clamp(28px, 3vw, 48px);
    left: clamp(28px, 3vw, 48px);
    display:flex;
    align-items:center;
    gap:12px;
  }
  #badge .mark{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(24px, 2.6vh, 36px);
    color: var(--bg);
    background: var(--orange);
    padding: 6px 12px;
    border-radius: 6px;
    letter-spacing: 0.02em;
  }
  #badge .badge-label{
    font-size: clamp(15px, 1.6vh, 20px);
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.14em;
  }

  #slide-index{
    position:fixed;
    top: clamp(28px, 3vw, 48px);
    right: clamp(28px, 3vw, 48px);
    font-family:'Archivo Black', sans-serif;
    color: var(--muted);
    font-size: clamp(16px, 1.8vh, 24px);
  }
  #slide-index b{ color: var(--orange); }

  #wrap{
    text-align:center;
  }
  #eyebrow{
    font-weight: 600;
    font-size: clamp(18px, 2vh, 26px);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: clamp(6px, 1vw, 14px);
  }
  #big-number{
    font-family:'Archivo Black', sans-serif;
    font-size: clamp(180px, 34vh, 560px);
    line-height: 1;
    color: var(--orange);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 60px rgba(255,115,0,0.25);
  }
  #label{
    margin-top: 8px;
    font-weight: 600;
    font-size: clamp(28px, 5vh, 50px);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text);
  }
  #underline{
    width: clamp(100px, 10vw, 180px);
    height: 8px;
    background: var(--red);
    margin: 22px auto 0;
    border-radius: 3px;
  }
  #percent-note{
    margin-top: 18px;
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(30px, 5.5vh, 52px);
    color: var(--orange);
    display:none;
  }
  #percent-note .of-total{
    font-family: 'Archivo', sans-serif;
    font-weight: 500;
    color: var(--muted);
    font-size: 0.55em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-left: 8px;
  }
  #top-list{
    display:none;
    flex-direction: column;
    gap: 18px;
    margin-top: 10px;
    min-width: clamp(500px, 46vw, 900px);
  }
  #top-list .row{
    display:flex;
    align-items:center;
    gap: 20px;
    background: #17130f;
    border: 1px solid var(--panel-edge);
    border-radius: 14px;
    padding: 14px 26px;
    text-align:left;
  }
  #top-list .row.rank-1{
    border-color: var(--orange);
    background: #201509;
  }
  #top-list .rank{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(30px, 5vh, 48px);
    color: var(--muted);
    width: 1.4em;
    flex-shrink: 0;
  }
  #top-list .row.rank-1 .rank{ color: var(--orange); }
  #top-list .cat-name{
    flex:1;
    font-size: clamp(22px, 3.4vh, 34px);
    font-weight: 600;
    color: var(--text);
  }
  #top-list .cat-count{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(32px, 5.4vh, 52px);
    color: var(--orange);
  }
  #meta{
    margin-top: 30px;
    color: var(--muted);
    font-size: clamp(15px, 1.8vh, 22px);
    letter-spacing: 0.04em;
  }
  #breakdown{
    margin-top: 26px;
    display:flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content:center;
    max-width: 70vw;
  }
  #breakdown .chip{
    display:flex;
    align-items:baseline;
    gap: 8px;
    background: #17130f;
    border: 1px solid var(--panel-edge);
    border-radius: 999px;
    padding: 8px 18px;
  }
  #breakdown .chip .owner-name{
    font-size: clamp(18px, 2.6vh, 26px);
    font-weight: 500;
    color: var(--text);
  }
  #breakdown .chip .owner-count{
    font-family: 'Archivo Black', sans-serif;
    font-size: clamp(20px, 3vh, 30px);
    color: var(--orange);
  }
  #warning{
    margin-top: 20px;
    display:none;
    color: #2a1c14;
    background: var(--orange);
    border: none;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 14px;
  }

  #clock{
    position:fixed;
    right: clamp(28px, 3vw, 48px);
    bottom: clamp(46px, 6vh, 68px);
    font-family:'Archivo Black', sans-serif;
    color: var(--muted);
    font-size: clamp(18px, 2.2vh, 28px);
    font-variant-numeric: tabular-nums;
  }
  #date{
    position:fixed;
    left: clamp(28px, 3vw, 48px);
    bottom: clamp(46px, 6vh, 68px);
    font-family:'Archivo Black', sans-serif;
    color: var(--muted);
    font-size: clamp(18px, 2.2vh, 28px);
  }

  #progress-track{
    position:fixed;
    left: clamp(28px, 3vw, 48px);
    right: clamp(28px, 3vw, 48px);
    bottom: clamp(24px, 3vw, 40px);
    height: 5px;
    background: var(--panel-edge);
    border-radius: 5px;
    overflow:hidden;
  }
  #progress-fill{
    height:100%;
    width:0%;
    background: var(--orange);
    border-radius: 5px;
  }
</style>
</head>
<body>
  <div id="stripe"><span></span><span></span></div>
  <div id="badge">
    <div class="mark">WB</div>
    <div class="badge-label">Tech Depot</div>
  </div>
  <div id="slide-index"><b id="slide-num">1</b> / <span id="slide-total">1</span></div>

  <div id="wrap">
    <div id="eyebrow">Open Cases</div>
    <div id="big-number">—</div>
    <div id="label">Loading…</div>
    <div id="underline"></div>
    <div id="percent-note"></div>
    <div id="top-list"></div>
    <div id="meta">SNAPSHOT — NOT LIVE &nbsp;·&nbsp; Updates Every Hour</div>
    <div id="breakdown"></div>
    <div id="warning">Showing sample data — check DATA_URL in config</div>
  </div>

  <div id="date">-- --- --</div>
  <div id="clock">--:--</div>
  <div id="progress-track"><div id="progress-fill"></div></div>

<script>
/* ============================================================
   CONFIG

   One workbook drives every slide below. Point DATA_URL at the
   raw case-list export living in the same repo/folder as this
   page (same-origin — see notes from earlier in the build).

   STATUS_COLUMN must match your export's column header exactly.
   Each slide either counts every row (filterValue: null) or
   counts rows where STATUS_COLUMN equals filterValue.

   To add more slides later (you mentioned more are coming),
   just add another { label, filterValue } entry below.
   ============================================================ */
const DATA_URL = "data.xlsx";
const SHEET_NAME = "";              // leave blank to use the first tab
const STATUS_COLUMN = "Status Reason";
const DWELL_SECONDS = 15;           // how long each slide stays on screen
const SYNC_MINUTE_PAST_HOUR = 2;    // refetch this many minutes after each hour,
                                     // to line up with the hourly export script
const FALLBACK_REFETCH_MINUTES = 15; // safety-net refetch, independent of the above

const OWNER_COLUMN = "Owner";
const HOLD_CODE_COLUMN = "On Hold Code";
const CSI_COLUMN = "CSI Sub Category";

const SLIDES = [
  { label: "Total",       filterValue: null },
  { label: "Unassigned",  filterValue: "Assigned", showPercentOfTotal: true },
  { label: "In Progress", filterValue: "In Progress", breakdownBy: OWNER_COLUMN, exclude: ["Tech Depot"] },
  { label: "On Hold",     filterValue: "On Hold", breakdownBy: HOLD_CODE_COLUMN, exclude: [] },
  { label: "Top Ticket Drivers", type: "topN", column: CSI_COLUMN, topN: 3 }
];

const SAMPLE_COUNTS = [47, 12, 24, 8]; // fallback numbers if the fetch fails, matched to SLIDES order
const SAMPLE_BREAKDOWN = [
  { name: "Sarah Lucio", count: 9 },
  { name: "John Widner", count: 8 },
  { name: "Lawrence Conway", count: 7 }
];
const SAMPLE_TOP_DRIVERS = [
  { name: "HHPOS - Payment Device", count: 19 },
  { name: "POS - Payment Device", count: 11 },
  { name: "TPHC Printer", count: 7 }
];
/* ============================================================ */

let rawRows = null;
let usingSample = false;
let currentIndex = 0;

function fmtTime(){
  return new Date().toLocaleString(undefined, { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function isRowEmpty(row){
  return Object.values(row).every(v => v === '' || v === null || v === undefined);
}

async function loadWorkbook(){
  try {
    const cacheBustUrl = DATA_URL + (DATA_URL.includes('?') ? '&' : '?') + 'v=' + Date.now();
    const resp = await fetch(cacheBustUrl, { cache: 'no-store' });
    if (!resp.ok) throw new Error('fetch failed: ' + resp.status);

    const buffer = await resp.arrayBuffer();
    const workbook = XLSX.read(buffer, { type: 'array' });
    const sheetName = SHEET_NAME && workbook.SheetNames.includes(SHEET_NAME)
      ? SHEET_NAME
      : workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];
    const rows = XLSX.utils.sheet_to_json(sheet, { defval: '' }).filter(r => !isRowEmpty(r));
    if (!rows.length) throw new Error('empty sheet');
    rawRows = rows;
    usingSample = false;
  } catch (err){
    rawRows = null;
    usingSample = true;
  }
}

function countForSlide(slide, index){
  if (usingSample || !rawRows){
    return SAMPLE_COUNTS[index] ?? 0;
  }
  if (slide.filterValue === null){
    return rawRows.length;
  }
  return rawRows.filter(r => r[STATUS_COLUMN] === slide.filterValue).length;
}

function breakdownForSlide(slide){
  if (!slide.breakdownBy) return null;
  if (usingSample || !rawRows){
    return SAMPLE_BREAKDOWN;
  }
  const exclude = slide.exclude || [];
  const matching = rawRows.filter(r =>
    (slide.filterValue === null || r[STATUS_COLUMN] === slide.filterValue) &&
    !exclude.includes(r[slide.breakdownBy])
  );
  const counts = {};
  matching.forEach(r => {
    const key = r[slide.breakdownBy] || '(unassigned)';
    counts[key] = (counts[key] || 0) + 1;
  });
  return Object.entries(counts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);
}

function topDriversForSlide(slide){
  if (slide.type !== 'topN') return null;
  if (usingSample || !rawRows){
    return SAMPLE_TOP_DRIVERS.slice(0, slide.topN || 3);
  }
  const counts = {};
  rawRows.forEach(r => {
    const key = r[slide.column] || '(uncategorized)';
    counts[key] = (counts[key] || 0) + 1;
  });
  const sorted = Object.entries(counts)
    .map(([name, count]) => ({ name, count }))
    .sort((a, b) => b.count - a.count);

  const n = slide.topN || 3;
  if (sorted.length <= n) return sorted;

  // include every entry tied with the Nth-place count, not just a hard cutoff
  const cutoffCount = sorted[n - 1].count;
  return sorted.filter((item, i) => i < n || item.count === cutoffCount);
}

function renderSlide(index){
  const slide = SLIDES[index];
  document.getElementById('slide-num').textContent = index + 1;
  document.getElementById('slide-total').textContent = SLIDES.length;
  document.getElementById('warning').style.display = usingSample ? 'block' : 'none';

  const numEl = document.getElementById('big-number');
  const labelEl = document.getElementById('label');
  const underlineEl = document.getElementById('underline');
  const topListEl = document.getElementById('top-list');
  const percentEl = document.getElementById('percent-note');
  const breakdownEl = document.getElementById('breakdown');

  if (slide.type === 'topN'){
    numEl.style.display = 'none';
    underlineEl.style.display = 'none';
    percentEl.style.display = 'none';
    breakdownEl.style.display = 'none';
    labelEl.textContent = slide.label;

    const drivers = topDriversForSlide(slide);
    topListEl.innerHTML = drivers.map((item, i) => {
      const rank = drivers.filter(d => d.count > item.count).length + 1;
      return `<div class="row rank-${rank}"><span class="rank">#${rank}</span><span class="cat-name">${item.name}</span><span class="cat-count">${item.count}</span></div>`;
    }).join('');
    topListEl.style.display = 'flex';
    return;
  }

  // standard single-number slides
  numEl.style.display = 'block';
  underlineEl.style.display = 'block';
  topListEl.style.display = 'none';
  topListEl.innerHTML = '';

  const count = countForSlide(slide, index);
  numEl.textContent = count.toLocaleString();
  labelEl.textContent = slide.label;

  const breakdown = breakdownForSlide(slide);
  if (breakdown && breakdown.length){
    breakdownEl.innerHTML = breakdown.map(item =>
      `<div class="chip"><span class="owner-name">${item.name}</span><span class="owner-count">${item.count}</span></div>`
    ).join('');
    breakdownEl.style.display = 'flex';
  } else {
    breakdownEl.innerHTML = '';
    breakdownEl.style.display = 'none';
  }

  if (slide.showPercentOfTotal){
    const totalCount = usingSample || !rawRows ? SAMPLE_COUNTS[0] : rawRows.length;
    const pct = totalCount ? ((count / totalCount) * 100).toFixed(1) : '0.0';
    percentEl.innerHTML = `${pct}%<span class="of-total">of Total Open Cases</span>`;
    percentEl.style.display = 'block';
  } else {
    percentEl.innerHTML = '';
    percentEl.style.display = 'none';
  }
}

function startProgressBar(){
  const fill = document.getElementById('progress-fill');
  fill.style.transition = 'none';
  fill.style.width = '0%';
  void fill.offsetWidth;
  fill.style.transition = `width linear ${DWELL_SECONDS}s`;
  fill.style.width = '100%';
}

function nextSlide(){
  currentIndex = (currentIndex + 1) % SLIDES.length;
  renderSlide(currentIndex);
  startProgressBar();
}

function msUntilNextSyncPoint(){
  const now = new Date();
  const next = new Date(now);
  next.setMinutes(SYNC_MINUTE_PAST_HOUR, 0, 0);
  if (next <= now){
    next.setHours(next.getHours() + 1);
  }
  return next - now;
}

function scheduleHourlySync(){
  const delay = msUntilNextSyncPoint();
  setTimeout(async () => {
    await loadWorkbook();
    renderSlide(currentIndex);
    // now that we're aligned, repeat every hour on the dot
    setInterval(async () => {
      await loadWorkbook();
      renderSlide(currentIndex);
    }, 60 * 60 * 1000);
  }, delay);
}

async function init(){
  await loadWorkbook();
  renderSlide(currentIndex);
  startProgressBar();
  setInterval(nextSlide, DWELL_SECONDS * 1000);
  scheduleHourlySync();

  // Fallback: independent of the aligned hourly sync above, also check
  // every 15 minutes regardless. If the aligned trigger ever gets missed
  // (slow git push, tab throttling, a network blip), this guarantees the
  // data is never more than ~15 minutes stale as a worst case.
  setInterval(async () => {
    await loadWorkbook();
    renderSlide(currentIndex);
  }, FALLBACK_REFETCH_MINUTES * 60 * 1000);
}

async function requestWakeLock(){
  try {
    if ('wakeLock' in navigator) {
      await navigator.wakeLock.request('screen');
    }
  } catch (err) {
    // Wake Lock not available/permitted in this environment — the
    // "Allow App to Manage Power" kiosk policy needs to be on for
    // this to succeed.
  }
}

// re-request if the lock gets released (e.g. after certain browser events)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') requestWakeLock();
});

function updateClock(){
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
}

function updateDate(){
  const el = document.getElementById('date');
  if (el) el.textContent = new Date().toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
}

init();
requestWakeLock();
updateClock();
updateDate();
setInterval(updateClock, 1000);
setInterval(updateDate, 60 * 1000);
</script>
</body>
</html>
